<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B27C4" />
<title>Friends League · eFootball 2027 Mobile</title>

<!-- ═══ แอปบนมือถือ (PWA): ติดตั้งจากเว็บได้ทั้ง Android และ iPhone · manifest.webmanifest + sw.js + icons/ ═══ -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Friends League">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Android/Chrome: เก็บสัญญาณ "ติดตั้งได้" ไว้ให้ปุ่ม "ติดตั้งเป็นแอป" (มาก่อนแอปโหลดเสร็จก็ไม่พลาด)
  window.addEventListener("beforeinstallprompt", function (e) { window.__flInstall = e; window.dispatchEvent(new Event("fl-install")); });
  window.addEventListener("appinstalled", function () { window.__flInstall = null; window.__flInstalled = true; window.dispatchEvent(new Event("fl-install")); });
</script>

<!-- ═══ PRELOAD: ให้ app.js เริ่มโหลดพร้อม Babel ไม่ต้องรอต่อคิว ═══ -->
<link rel="preload" href="app.js" as="fetch" crossorigin="anonymous">

<!-- ═══ FONTS: Kanit (มีตัวเอียง) = หัวข้อ/ตัวเลขสไตล์เกม · Noto Sans Thai = เนื้อหา ═══ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ═══ STYLES ═══ -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // ธีมสไตล์ eFootball 2022 (น้ำเงิน + เหลือง) — ค่าสีจริงอยู่ใน style.css
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          page:        "rgb(var(--page) / <alpha-value>)",
          surface:     "rgb(var(--surface) / <alpha-value>)",
          sunken:      "rgb(var(--sunken) / <alpha-value>)",
          ink:         "rgb(var(--ink) / <alpha-value>)",
          soft:        "rgb(var(--soft) / <alpha-value>)",
          muted:       "rgb(var(--muted) / <alpha-value>)",
          faint:       "rgb(var(--faint) / <alpha-value>)",
          line:        "rgb(var(--line) / <alpha-value>)",
          accent:      "rgb(var(--accent) / <alpha-value>)",
          "on-accent": "rgb(var(--on-accent) / <alpha-value>)",
          link:        "rgb(var(--link) / <alpha-value>)",
          win:         "rgb(var(--win) / <alpha-value>)",
          loss:        "rgb(var(--loss) / <alpha-value>)",
        },
        fontFamily: {
          sans:    ['"Noto Sans Thai"', "system-ui", "sans-serif"],
          display: ["Kanit", '"Noto Sans Thai"', "sans-serif"],
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="style.css">

<!-- ═══ REACT (global window.React / window.ReactDOM — ไม่ใช้ import) ═══ -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<!-- ค่าตั้งค่า Firebase (ไม่ใช่รหัสลับ) -->
<script src="config.js"></script>
<!-- Babel ต้องล็อกไว้ที่ 7.x ห้ามลบเลขเวอร์ชัน / ห้ามอัปเป็น 8
     Babel 8 แอบใส่ import "react/jsx-runtime" → ค้างหน้า "กำลังโหลด…" (ทดสอบแล้ว ใส่ @jsxRuntime classic ก็ไม่ช่วย) -->
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>

  <!-- ═══ กรอบขอบเว็บสีเหลือง (ตกแต่งเท่านั้น · ลอยอยู่หลังเนื้อหา) ═══
       พุ่งออกจากขอบตอนเปิด → ขยับเข้าออกเบา ๆ + บางชิ้นกะพริบ · prefers-reduced-motion = ลายนิ่ง -->
  <div class="ef-stripes" aria-hidden="true">
    <!-- กรอบขอบเว็บแบบ eFootball Championship: เศษแสงเหลืองแหลม ๆ พุ่งจากขอบซ้าย/ขวา + ห้อยจากใต้แถบเมนู + พุ่งขึ้นจากมุมล่าง
         แถบข้างกว้างเท่าที่ว่างข้างเนื้อหา (style.css) · ช่วงบนสุดมีแต่ชิ้นสั้น ๆ → ไม่ยื่นไปทับหัวข้อหน้า แม้ในมือถือ
         หนาม/เศษ = polygon · สายฟ้า/กากบาท = เส้น (ความหนาคงที่ไม่ยืดตามจอ) · .dn = ห้อยลง · .up = พุ่งขึ้น · ไม่มีชิ้นไหนซ้อนกัน -->
    <svg class="fl" viewBox="0 0 200 1000" preserveAspectRatio="none">
      <g class="breathe s">
        <polygon class="in dn" style="animation-delay:.04s" points="10,0 44,0 24,190" />
        <polygon class="in dn" style="animation-delay:.14s" points="60,0 90,0 74,84" />
        <polygon class="in dn" style="animation-delay:.22s" points="104,0 128,0 114,40" />
        <polygon class="in" style="animation-delay:.10s" points="0,232 174,272 0,296" />
        <polyline class="in bolt" style="animation-delay:.20s" points="0,372 114,388 72,404 180,440" />
        <polygon class="in" style="animation-delay:.30s" points="0,520 200,548 0,560" />
        <g class="flick">
          <line class="in bolt" style="animation-delay:.40s" x1="24" y1="630" x2="128" y2="716" />
          <line class="in bolt" style="animation-delay:.44s" x1="128" y1="630" x2="24" y2="716" />
        </g>
        <polygon class="in" style="animation-delay:.50s" points="0,790 140,818 92,856 0,866" />
        <polygon class="in" style="animation-delay:.58s" points="0,904 120,930 0,946" />
        <polygon class="in up" style="animation-delay:.64s" points="92,1000 106,960 120,1000" />
        <polygon class="in up" style="animation-delay:.70s" points="136,1000 160,876 184,1000" />
      </g>
    </svg>
    <svg class="fr" viewBox="0 0 200 1000" preserveAspectRatio="none">
      <g class="breathe s">
        <polygon class="in dn" style="animation-delay:.08s" points="190,0 156,0 176,170" />
        <polygon class="in dn" style="animation-delay:.18s" points="140,0 112,0 128,70" />
        <polygon class="in dn" style="animation-delay:.26s" points="98,0 76,0 88,34" />
        <polygon class="in" style="animation-delay:.14s" points="200,210 30,250 200,270" />
        <g class="flick flick-2">
          <polyline class="in bolt" style="animation-delay:.24s" points="200,330 92,350 134,368 22,410" />
        </g>
        <polygon class="in" style="animation-delay:.34s" points="200,480 8,508 200,522" />
        <line class="in bolt" style="animation-delay:.44s" x1="176" y1="600" x2="74" y2="686" />
        <line class="in bolt" style="animation-delay:.48s" x1="74" y1="600" x2="176" y2="686" />
        <polygon class="in" style="animation-delay:.54s" points="200,752 58,782 110,822 200,832" />
        <polygon class="in" style="animation-delay:.62s" points="200,890 64,918 200,934" />
        <g class="flick flick-3"><polygon class="in up" style="animation-delay:.68s" points="110,1000 96,962 82,1000" /></g>
        <polygon class="in up" style="animation-delay:.72s" points="70,1000 46,872 22,1000" />
      </g>
    </svg>
  </div>

  <div id="root">
    <div class="boot">
      <div class="boot-ring"></div>
      <div>กำลังโหลด Friends League…</div>
    </div>
  </div>

  <!-- data-presets="react" = แปลงเฉพาะ JSX (ห้ามมี import ในไฟล์) -->
  <script type="text/babel" data-presets="react" src="app.js"></script>

  <!-- ═══ ERROR GUARD: ถ้า 6 วิแล้วยังไม่ mount แปลว่ามีอะไรพัง ═══ -->
  <script>
    setTimeout(function () {
      var boot = document.querySelector('#root .boot');
      if (!boot) return; // React mount สำเร็จแล้ว
      boot.innerHTML =
        '<div style="max-width:460px;text-align:left;line-height:1.9">' +
        '<div style="color:rgb(var(--accent));font-size:15px;margin-bottom:10px">⚠️ โหลดไม่สำเร็จ</div>' +
        '<div style="font-size:13px">เช็ค 3 ข้อนี้ตามลำดับ:</div>' +
        '<div style="font-size:13px;margin-top:8px">' +
        '1. เปิดผ่าน http://localhost ไม่ใช่ file:// ?<br>' +
        '2. app.js อยู่โฟลเดอร์เดียวกับ index.html ?<br>' +
        '3. app.js มีคำว่า <code style="color:rgb(var(--accent))">import</code> อยู่ไหม → ต้องไม่มี<br>' +
        '</div>' +
        '<div style="font-size:12px;color:rgb(var(--faint));margin-top:12px">กด F12 → แท็บ Console เพื่อดูรายละเอียด</div>' +
        '</div>';
    }, 6000);
  </script>

  <!-- ═══ PWA: service worker (เฉพาะ https และ localhost · เปิดผ่าน 127.0.0.1 ตอนแก้โค้ดจะไม่ลง เพื่อไม่ให้ติดแคช) ═══ -->
  <script>
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  </script>

</body>
</html>
