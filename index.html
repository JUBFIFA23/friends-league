<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0B27C4" />
<title>Friends League · eFootball 2027 Mobile</title>

<!-- ═══ PRELOAD: ให้ app.js เริ่มโหลดพร้อม Babel ไม่ต้องรอต่อคิว ═══ -->
<link rel="preload" href="app.js" as="fetch" crossorigin="anonymous">

<!-- ═══ FONTS: Kanit (มีตัวเอียง) = หัวข้อ/ตัวเลขสไตล์เกม · Noto Sans Thai = เนื้อหา ═══ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ═══ STYLES ═══ -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // ธีมสไตล์ eFootball 2022 (น้ำเงิน + เหลือง) — ค่าสีจริงอยู่ใน style.css
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          page:        "rgb(var(--page) / <alpha-value>)",
          surface:     "rgb(var(--surface) / <alpha-value>)",
          sunken:      "rgb(var(--sunken) / <alpha-value>)",
          ink:         "rgb(var(--ink) / <alpha-value>)",
          soft:        "rgb(var(--soft) / <alpha-value>)",
          muted:       "rgb(var(--muted) / <alpha-value>)",
          faint:       "rgb(var(--faint) / <alpha-value>)",
          line:        "rgb(var(--line) / <alpha-value>)",
          accent:      "rgb(var(--accent) / <alpha-value>)",
          "on-accent": "rgb(var(--on-accent) / <alpha-value>)",
          link:        "rgb(var(--link) / <alpha-value>)",
          win:         "rgb(var(--win) / <alpha-value>)",
          loss:        "rgb(var(--loss) / <alpha-value>)",
        },
        fontFamily: {
          sans:    ['"Noto Sans Thai"', "system-ui", "sans-serif"],
          display: ["Kanit", '"Noto Sans Thai"', "sans-serif"],
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="style.css">

<!-- ═══ REACT (global window.React / window.ReactDOM — ไม่ใช้ import) ═══ -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<!-- ค่าตั้งค่า Google Drive (ไม่ใช่รหัสลับ) -->
<script src="config.js"></script>
<!-- Babel ต้องล็อกไว้ที่ 7.x ห้ามลบเลขเวอร์ชัน / ห้ามอัปเป็น 8
     Babel 8 แอบใส่ import "react/jsx-runtime" → ค้างหน้า "กำลังโหลด…" (ทดสอบแล้ว ใส่ @jsxRuntime classic ก็ไม่ช่วย) -->
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>

  <!-- ═══ พื้นหลังลายเหลืองแบบ eFootball 2022 (ตกแต่งเท่านั้น · ลอยอยู่หลังเนื้อหา) ═══
       เส้นพุ่งเข้าตอนเปิด → ลอยขยับช้า ๆ + แสงวาบวิ่งผ่าน · prefers-reduced-motion = ลายนิ่ง -->
  <div class="ef-stripes" aria-hidden="true">
    <!-- มุมขวาบน: เส้นเฉียงขนานกัน 3 เส้น + รอยตัดเล็กด้านบน + แถบมุมขวาใต้เส้น (ไม่มีเส้นไหนตัดกัน) -->
    <svg class="tr" viewBox="0 0 1000 700" preserveAspectRatio="xMaxYMin meet">
      <defs>
        <linearGradient id="efGlint" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0" />
          <stop offset=".5" stop-color="#fff" stop-opacity=".8" />
          <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </linearGradient>
        <clipPath id="efClipTR">
          <rect x="520" y="140" width="800" height="110" rx="55" />
          <rect x="700" y="290" width="620" height="60" rx="30" />
        </clipPath>
      </defs>
      <g class="drift">
        <g transform="rotate(-22 1000 0)">
          <g class="s">
            <rect class="in" style="animation-delay:.00s" x="420" y="80" width="900" height="20" rx="10" />
            <rect class="in" style="animation-delay:.10s" x="520" y="140" width="800" height="110" rx="55" />
            <rect class="in" style="animation-delay:.22s" x="700" y="290" width="620" height="60" rx="30" />
            <path class="in" style="animation-delay:.34s" d="M600 18 h80 l-30 44 h-80 z" />
          </g>
          <g clip-path="url(#efClipTR)"><rect class="glint" x="300" y="120" width="220" height="260" fill="url(#efGlint)" /></g>
        </g>
        <path class="s in-y" style="animation-delay:.45s" d="M1000 470 L1000 548 L934 700 L852 700 Z" />
      </g>
    </svg>
    <!-- มุมซ้ายล่าง: เส้นเฉียงขนานกัน 3 เส้น + หัวลูกศรชี้ขวา -->
    <svg class="bl" viewBox="0 0 1000 700" preserveAspectRatio="xMinYMax meet">
      <defs>
        <clipPath id="efClipBL">
          <rect x="-300" y="470" width="820" height="110" rx="55" />
          <rect x="-300" y="400" width="660" height="40" rx="20" />
        </clipPath>
      </defs>
      <g class="drift">
        <g transform="rotate(-22 0 700)">
          <g class="s">
            <rect class="in" style="animation-delay:.16s" x="-300" y="470" width="820" height="110" rx="55" />
            <rect class="in" style="animation-delay:.28s" x="-300" y="400" width="660" height="40" rx="20" />
            <rect class="in" style="animation-delay:.04s" x="-300" y="612" width="1000" height="20" rx="10" />
            <path class="in" style="animation-delay:.40s" d="M60 300 L230 340 L60 380 L104 340 Z" />
          </g>
          <g clip-path="url(#efClipBL)"><rect class="glint glint-b" x="-420" y="380" width="220" height="220" fill="url(#efGlint)" /></g>
        </g>
      </g>
    </svg>
  </div>

  <div id="root">
    <div class="boot">
      <div class="boot-ring"></div>
      <div>กำลังโหลด Friends League…</div>
    </div>
  </div>

  <!-- data-presets="react" = แปลงเฉพาะ JSX (ห้ามมี import ในไฟล์) -->
  <script type="text/babel" data-presets="react" src="app.js"></script>

  <!-- ═══ ERROR GUARD: ถ้า 6 วิแล้วยังไม่ mount แปลว่ามีอะไรพัง ═══ -->
  <script>
    setTimeout(function () {
      var boot = document.querySelector('#root .boot');
      if (!boot) return; // React mount สำเร็จแล้ว
      boot.innerHTML =
        '<div style="max-width:460px;text-align:left;line-height:1.9">' +
        '<div style="color:rgb(var(--accent));font-size:15px;margin-bottom:10px">⚠️ โหลดไม่สำเร็จ</div>' +
        '<div style="font-size:13px">เช็ค 3 ข้อนี้ตามลำดับ:</div>' +
        '<div style="font-size:13px;margin-top:8px">' +
        '1. เปิดผ่าน http://localhost ไม่ใช่ file:// ?<br>' +
        '2. app.js อยู่โฟลเดอร์เดียวกับ index.html ?<br>' +
        '3. app.js มีคำว่า <code style="color:rgb(var(--accent))">import</code> อยู่ไหม → ต้องไม่มี<br>' +
        '</div>' +
        '<div style="font-size:12px;color:rgb(var(--faint));margin-top:12px">กด F12 → แท็บ Console เพื่อดูรายละเอียด</div>' +
        '</div>';
    }, 6000);
  </script>

</body>
</html>
