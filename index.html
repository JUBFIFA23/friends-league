<!-- ═══ แอปบนมือถือ (PWA): ติดตั้งจากเว็บได้ทั้ง Android และ iPhone · manifest.webmanifest + sw.js + icons/ ═══ -->

<script>
  // Android/Chrome: เก็บสัญญาณ "ติดตั้งได้" ไว้ให้ปุ่ม "ติดตั้งเป็นแอป" (มาก่อนแอปโหลดเสร็จก็ไม่พลาด)
  window.addEventListener("beforeinstallprompt", function (e) { window.__flInstall = e; window.dispatchEvent(new Event("fl-install")); });
  window.addEventListener("appinstalled", function () { window.__flInstall = null; window.__flInstalled = true; window.dispatchEvent(new Event("fl-install")); });
</script>

     Babel 8 แอบใส่ import "react/jsx-runtime" → ค้างหน้า "กำลังโหลด…" (ทดสอบแล้ว ใส่ @jsxRuntime classic ก็ไม่ช่วย) -->
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>

  <!-- ═══ โลโก้เว็บ: ถ้วยเงินริบบิ้นสองข้าง + ลูกบอลแก้วลายรังผึ้ง + ลายวงจร (วาดเองตามรูปที่ผู้ใช้ส่งมา · ไม่ใช้รูปจริง) ═══
       window.flLogo(detail, idPrefix, text) → SVG · "full" = ลายครบ + ข้อความบนครีบแก้ว (อินโทร / ไอคอนแอป)
       "simple" = เส้นน้อย ชัดตอนเล็ก (หัวเว็บ) · ใช้ร่วมกันทั้งอินโทรด้านล่างและ app.js (คอมโพเนนต์ Logo) -->
  <script>
    window.flLogo = function (detail, p, text) {
      var full = detail === "full";
      function hex(cx, cy, r) {
        var s = [];
        for (var i = 0; i < 6; i++) { var a = Math.PI / 3 * i; s.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1)); }
        return s.join(" ");
      }
      var C = [58, 36], R = 25, comb = '<polygon points="' + hex(C[0], C[1], 8) + '"/>';
      if (full) for (var k = 0; k < 6; k++) { var a = Math.PI / 6 + Math.PI / 3 * k; comb += '<polygon points="' + hex(C[0] + 13.9 * Math.cos(a), C[1] + 13.9 * Math.sin(a), 8) + '"/>'; }
      else for (var j = 0; j < 6; j++) { var b = Math.PI / 3 * j; comb += '<line x1="' + (C[0] + 8 * Math.cos(b)).toFixed(1) + '" y1="' + (C[1] + 8 * Math.sin(b)).toFixed(1) + '" x2="' + (C[0] + 25 * Math.cos(b)).toFixed(1) + '" y2="' + (C[1] + 25 * Math.sin(b)).toFixed(1) + '"/>'; }
      var cyan = "#3FF0DB";
      return '<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
          '<linearGradient id="' + p + 'sl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#DDE5EB"/><stop offset=".7" stop-color="#97A6B4"/><stop offset="1" stop-color="#55636E"/></linearGradient>' +
          '<linearGradient id="' + p + 'sr" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F9FB"/><stop offset=".45" stop-color="#C4CFD8"/><stop offset="1" stop-color="#65737E"/></linearGradient>' +
          '<linearGradient id="' + p + 'gl" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8FFFC" stop-opacity=".85"/><stop offset=".45" stop-color="#86EEE1" stop-opacity=".42"/><stop offset="1" stop-color="#1FA89A" stop-opacity=".55"/></linearGradient>' +
          '<radialGradient id="' + p + 'ball" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#F6FFFE"/><stop offset=".42" stop-color="#A9F6EC"/><stop offset=".8" stop-color="#33C7B7"/><stop offset="1" stop-color="#0E5E5A"/></radialGradient>' +
          '<radialGradient id="' + p + 'glow"><stop offset=".5" stop-color="#5FF5E2" stop-opacity=".5"/><stop offset="1" stop-color="#5FF5E2" stop-opacity="0"/></radialGradient>' +
          '<clipPath id="' + p + 'clip"><circle cx="' + C[0] + '" cy="' + C[1] + '" r="' + (R - .5) + '"/></clipPath>' +
        '</defs>' +
        '<circle cx="' + C[0] + '" cy="' + C[1] + '" r="36" fill="url(#' + p + 'glow)"/>' +
        // ด้านในถ้วย (เขียวเข้ม) + ลายวงจร
        '<path d="M27 64 C28 88 42 108 60 118 C77 106 89 84 90 52 C80 62 40 66 27 64 Z" fill="#0B3B3C"/>' +
        '<g fill="none" stroke="' + cyan + '" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M37 76 H46 L52 82 V96"/><path d="M82 72 H73 L67 78 V100"/>' + (full ? '<path d="M59 74 V90 L55 94"/><path d="M33 70 L40 72"/>' : '') +
        '</g>' +
        '<g fill="' + cyan + '"><circle cx="52" cy="96" r="1.8"/><circle cx="67" cy="100" r="1.8"/>' + (full ? '<circle cx="55" cy="94" r="1.6"/>' : '') + '</g>' +
        // ลูกบอลแก้ว
        '<circle cx="' + C[0] + '" cy="' + C[1] + '" r="' + R + '" fill="url(#' + p + 'ball)"/>' +
        '<g clip-path="url(#' + p + 'clip)" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.1">' + comb + '</g>' +
        '<circle cx="' + C[0] + '" cy="' + C[1] + '" r="' + R + '" fill="none" stroke="#E6FFFC" stroke-opacity=".8" stroke-width="1.2"/>' +
        '<path d="M41 22 A21 21 0 0 1 55 13" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>' +
        // ริบบิ้นซ้าย (เงิน) ม้วนขึ้นโอบลูกบอลด้านซ้าย · ขอบบนมีแสง
        '<path d="M57 126 C33 116 15 92 15 64 C15 50 22 40 33 34 L37 41 C29 46 26 54 27 64 C28 88 42 108 60 118 Z" fill="url(#' + p + 'sl)"/>' +
        '<path d="M16 64 C16 51 22.5 41 32.6 35" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>' +
        (full ? '<path d="M30 50 C28 58 28.5 70 31 80" fill="none" stroke="' + cyan + '" stroke-opacity=".75" stroke-width="1"/>' : '') +
        // ขอบปากถ้วยด้านหน้า (ลูกบอลดูอยู่ในถ้วย)
        '<path d="M27 63 C42 72 74 70 90 54" fill="none" stroke="#E9F0F4" stroke-width="2.4" stroke-linecap="round"/>' +
        // ครีบขวาพุ่งสูง: แบบเต็ม = แก้วใส มีข้อความ · แบบเรียบ = เงิน
        (full
          ? '<path d="M61 126 C86 116 101 92 101 64 L104 18 C96 27 91 40 90 52 C89 84 77 106 59 118 Z" fill="url(#' + p + 'gl)" stroke="#EAF6F8" stroke-width="1.3" stroke-linejoin="round"/>' +
            '<path d="M98 30 C95 42 95.5 64 94 76" fill="none" stroke="' + cyan + '" stroke-opacity=".7" stroke-width="1"/>' +
            (text ? '<text transform="translate(93.5 103) rotate(-71)" font-family="Kanit, sans-serif" font-style="italic" font-weight="700" font-size="6.4" letter-spacing=".4" fill="#E8FFFC">' + text + '</text>' : '')
          : '<path d="M61 126 C86 116 101 92 101 64 L104 18 C96 27 91 40 90 52 C89 84 77 106 59 118 Z" fill="url(#' + p + 'sr)"/>') +
        '<path d="M103.4 20 C97 28 92.5 39 91 51" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>' +
        // ก้าน + ฐานแผงวงจร (แบบเต็มมีชิปและเศษแผงลอยข้าง ๆ)
        '<path d="M55 118 H65 L63 129 H57 Z" fill="#7E8C98"/>' +
        '<path d="M29 131 H91 L84.5 148 H35.5 Z" fill="#0D3A3B" stroke="' + cyan + '" stroke-width=".9" stroke-linejoin="round"/>' +
        '<g fill="none" stroke="' + cyan + '" stroke-width="1" stroke-linecap="round"><path d="M36 139 H45"/><path d="M55 138 H65"/><path d="M75 139 H84"/>' + (full ? '<path d="M50 144 H70"/>' : '') + '</g>' +
        (full
          ? '<rect x="45" y="134.5" width="10" height="8" rx="1" fill="#072526" stroke="' + cyan + '" stroke-width=".8"/><rect x="65" y="135.5" width="9.5" height="7" rx="1" fill="#072526" stroke="' + cyan + '" stroke-width=".8"/>' +
            '<path d="M13 136 L25 132.5 L27.5 139 L16 142.5 Z" fill="#0D3A3B" stroke="' + cyan + '" stroke-width=".8"/>' +
            '<path d="M107 136 L95 132.5 L92.5 139 L104 142.5 Z" fill="#0D3A3B" stroke="' + cyan + '" stroke-width=".8"/>'
          : '') +
      '</svg>';
    };
  </script>

  <!-- ═══ อินโทรตอนเปิดเว็บ แบบตัวอย่างเกม eFootball 2022 (วินาทีที่ 0–8) · ตกแต่งเท่านั้น ═══
       แถบเหลืองกวาดเข้า → วงแหวนวาดรอบถ้วยรางวัล → ชื่อลีก → แถบกวาดออกเข้าหน้าเว็บ (~2.9 วิ · แตะเพื่อข้าม)
       เล่นครั้งแรกที่เปิดเว็บในแท็บนี้ (รีเฟรชไม่เล่นซ้ำ) · prefers-reduced-motion = ไม่เล่น · ไม่ใช้โลโก้ e ของ eFootball (เครื่องหมายการค้า) -->
  <div class="fl-intro" id="fl-intro" aria-hidden="true">
    <div class="sweep-in">
      <div class="lane" style="--t:6%;--h:1.2vh;--x:8%;--w:52%;--d:.05s"><i></i></div>
      <div class="lane" style="--t:14%;--h:3.6vh;--x:30%;--w:64%;--d:.12s"><i></i></div>
      <div class="lane" style="--t:24%;--h:.8vh;--x:0%;--w:40%;--d:.2s"><i></i></div>
      <div class="lane" style="--t:31%;--h:5vh;--x:40%;--w:58%;--d:.08s"><i></i></div>
      <div class="lane" style="--t:44%;--h:1.4vh;--x:12%;--w:70%;--d:.26s"><i></i></div>
      <div class="lane" style="--t:52%;--h:6.5vh;--x:0%;--w:46%;--d:.16s"><i></i></div>
      <div class="lane" style="--t:63%;--h:.9vh;--x:36%;--w:60%;--d:.3s"><i></i></div>
      <div class="lane" style="--t:70%;--h:4.2vh;--x:22%;--w:66%;--d:.1s"><i></i></div>
      <div class="lane" style="--t:80%;--h:1.6vh;--x:50%;--w:44%;--d:.22s"><i></i></div>
      <div class="lane" style="--t:88%;--h:3vh;--x:6%;--w:58%;--d:.34s"><i></i></div>
    </div>
    <div class="mark">
      <svg class="fl-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" /></svg>
      <div class="cup"></div>
    </div>
    <div class="word">FRIENDS LEAGUE</div>
    <div class="sub">EFOOTBALL 2027 MOBILE</div>
    <div class="sweep-out">
      <div class="lane" style="--t:10%;--h:2.4vh;--x:20%;--w:60%;--d:2s"><i></i></div>
      <div class="lane" style="--t:22%;--h:.8vh;--x:0%;--w:44%;--d:2.12s"><i></i></div>
      <div class="lane" style="--t:36%;--h:5vh;--x:30%;--w:62%;--d:2.05s"><i></i></div>
      <div class="lane" style="--t:50%;--h:1.2vh;--x:8%;--w:70%;--d:2.2s"><i></i></div>
      <div class="lane" style="--t:61%;--h:6vh;--x:40%;--w:52%;--d:2.1s"><i></i></div>
      <div class="lane" style="--t:74%;--h:1vh;--x:16%;--w:58%;--d:2.24s"><i></i></div>
      <div class="lane" style="--t:86%;--h:3.4vh;--x:4%;--w:66%;--d:2.15s"><i></i></div>
    </div>
  </div>
  <script>
    // เปิดแท็บนี้ครั้งแรก + เครื่องไม่ได้ตั้งลดการเคลื่อนไหว → เล่นอินโทร · จบหรือแตะ → ลบทิ้ง (data-intro บน <html> บอกว่าเกิดอะไรขึ้น)
    (function () {
      var el = document.getElementById("fl-intro"), seen = false, cup = el.querySelector(".cup");
      if (cup && window.flLogo) cup.innerHTML = flLogo("full", "in", "FRIENDS LEAGUE");   // โลโก้ใหญ่ในวงแหวน
      try { seen = sessionStorage.getItem("fl_intro") === "1"; sessionStorage.setItem("fl_intro", "1"); } catch (e) {}
      var still = !!window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var done = function () { if (el.parentNode) el.parentNode.removeChild(el); };
      document.documentElement.setAttribute("data-intro", seen ? "seen" : still ? "still" : "play");
      if (seen || still) return done();
      el.className += " play";
      el.addEventListener("click", done);
      el.addEventListener("animationend", function (e) { if (e.target === el) done(); });
      setTimeout(done, 4500);   // กันค้าง (เบราว์เซอร์ที่ไม่ส่ง animationend)
    })();
  </script>

  <!-- ═══ แถบเหลืองวิ่งที่ขอบเว็บ แบบตัวอย่างเกม eFootball 2022 · ตกแต่งเท่านั้น ลอยอยู่หลังเนื้อหา ═══
       สุ่มลายเองด้วยสคริปต์ข้างล่าง (makeBars): 8 แบบที่วาดมา + แถบล้วนไม่มีเส้นเฉียง 3 แบบ · เส้นเฉียง 45° ติดปลายแถบด้านใน · ฝั่งขวากลับด้านให้เอง
       แต่ละข้างแบ่งเป็นช่องสูงไม่เท่ากัน (กลุ่มละช่อง → ไม่ซ้อนกัน) · ทุกครั้งที่กลุ่มถอยพ้นจอ สุ่มลายใหม่ (ลายไม่เบิ้ล: บนจอไม่มีแบบซ้ำกัน)
       อยู่แค่ในขอบว่างข้างเนื้อหา (ความกว้างอยู่ใน style.css) · prefers-reduced-motion = ภาพนิ่ง (สุ่มครั้งเดียวตอนเปิด) -->
  <div class="ef-stripes" aria-hidden="true"><div class="fl"></div><div class="fr"></div></div>
  <script>
      // แถบเหลืองที่ขอบ: สุ่มลายจากแบบที่วาดมา 8 แบบ + แถบล้วน (ไม่มีเส้นเฉียง) 3 แบบ · makeBars(กล่อง .ef-stripes, ขนาดขั้นต่ำ px) → ฟังก์ชันสร้างลาย
      // พิกัดฝั่งซ้าย (x = 0 คือขอบจอ ปลายแถบอยู่ด้านใน) · ฝั่งขวากลับด้านให้เอง → แบบที่ 6 กับ 8 ในรูปคือแบบ 1 กับ 7 ที่กลับด้าน
      // เส้นเฉียง 45° ติดปลายแถบด้านในเสมอ และอยู่ในช่วงความยาวของแถบ (ไม่ยื่นเลยปลาย) · แต่ละช่องมีลายเดียว → ไม่ซ้อนกัน · ลายไม่เบิ้ล (ดู draw)
      function makeBars(root, PX) {
        var R = Math.random, rnd = function (a, b) { return a + R() * (b - a); }, pick = function (a) { return a[Math.floor(R() * a.length)]; };
        var r1 = function (v) { return Math.round(v * 10) / 10; }, SVGNS = "http://www.w3.org/2000/svg", SLOTS = 4;   // กลุ่มต่อข้าง (ขอบแคบได้ถึง 7 ดู build)
        // ท่าเคลื่อน (keyframes ใน style.css): พุ่งเข้า-ค้าง-ถอย · ยืดออกจากขอบ · กระตุกเข้าแบบดิจิทัล
        var MOTION = [["ef-bar", "cubic-bezier(.2, .9, .2, 1)"], ["ef-grow", "cubic-bezier(.2, .9, .2, 1)"], ["ef-step", "steps(1, end)"]];
        // ความหนา = สัดส่วนของความกว้างแถบข้าง [ต่ำสุด, สูงสุด, อย่างน้อยกี่ px]: 0 บาง · 1 กลาง · 2 หนา · cap = หนาได้ไม่เกิน (ให้ลายพอดีช่อง)
        var TIERS = [[.02, .05, 2], [.07, .15, 4], [.18, .34, 7]];
        var thick = function (W, tier, cap) { var t = TIERS[tier]; return Math.max(t[2] * PX, Math.min(cap, W * rnd(t[0], t[1]))); };
        // ขอบแคบ (กว้างไม่ถึง 40px เช่นมือถือ): แถบยาวเกือบเต็มขอบ (เว้นห่างเนื้อหาไว้นิด ไม่ดูติดกัน) · เส้นเฉียงพอดีที่ว่าง ไม่ล้นขอบจอ → ลายครบทุกชิ้น ไม่เป็นเศษ
        var NARROW = false;
        var len = function (W, a, b) { return W * (NARROW ? rnd(.75, .92) : rnd(a, b)); };
        var sw = function (W, s) { return NARROW ? Math.min(s, W * .3) : s; };   // ความหนาเส้นเฉียง
        var room = function (want, space, min) { return Math.max(Math.min(min, space), Math.min(want, space)); };   // อยากได้เท่านี้ (อย่างน้อย min) แต่ไม่เกินที่ว่าง

          // แบบ 2: เส้นบาง + ขีดเล็กห้อยใต้ปลาย
          tickBelow: function (W, G, M) { var t = thick(W, 0, M / 6), L = len(W, .55, .95), s = sw(W, Math.max(2 * PX, t * rnd(1.2, 1.8))), v = room(t * rnd(2, 3.5), L - s, 4 * PX);
            return [bar(0, 0, L, t), slash(L - s, t + G * .6, L - s - v, t + G * .6 + v, s)]; },
          // แบบ 3: ขีดเล็กลงมาจรดปลายจากด้านบน + เส้นบาง
          tickAbove: function (W, G, M) { var t = thick(W, 0, M / 6), L = len(W, .55, .95), s = sw(W, Math.max(2 * PX, t * rnd(1.2, 1.8))), v = room(t * rnd(2, 3.5), L - s, 4 * PX);

          // แบบ 4 (=\): เส้นบนสั้น + เส้นเฉียงต่อจากปลายเส้นบน ลงไปจรดปลายเส้นล่าง (เส้นล่างยาวกว่า)
          eqSlash: function (W, G, M) { var t1 = thick(W, Math.floor(R() * 2), (M - G) / 4), t2 = thick(W, 1 + Math.floor(R() * 2), (M - G) / 4), s = sw(W, Math.max(3 * PX, t1 * rnd(.8, 1.3)));
            var v = Math.max(t1 + 4 * PX, Math.min(t1 * rnd(1.8, 3), M - G - t2)), L1 = W * rnd(.35, .6), X = W * (NARROW ? .92 : .97);

            if (L2 > X) { L1 = Math.max(W * .15, L1 - (L2 - X)); L2 = L1 + G + v + s; }

          // แบบ 5: แถบล่างหนา + เส้นเฉียงชี้ขึ้นจากปลายแถบล่าง เอนกลับไปทางขอบจอ ผ่านปลายเส้นบนที่สั้นกว่า

          // แบบ 7 (และ 8): เส้นเฉียงลงมาจรดปลายเส้นฐานจากด้านบน
          landBack: function (W, G, M) { var t = thick(W, 1 + Math.floor(R() * 2), (M - G) / 3.4), Lb = len(W, .55, 1), s = sw(W, Math.max(3 * PX, t * rnd(.6, .9)));

          // ── แถบล้วน ไม่มีเส้นเฉียง ──
          // แถบเดียวหนา ๆ
          solo: function (W, G, M) { return [bar(0, 0, len(W, .5, .95), thick(W, 1 + Math.floor(R() * 2), (M - G) / 3.4))]; },
          // 2 เส้นซ้อน ยาวไม่เท่ากัน หนาไม่เท่ากัน (สุ่มว่าเส้นสั้นหรือเส้นยาวอยู่บน)
          twin: function (W, G, M) { var c = (M - G) / 3, a = thick(W, Math.floor(R() * 2), c), b = thick(W, 1 + Math.floor(R() * 2), c), S = W * rnd(NARROW ? .5 : .35, .6), L = Math.min(W * (NARROW ? .92 : .97), S + W * rnd(.18, .35));
            if (R() < .5) { var x = a; a = b; b = x; }
            return R() < .5 ? [bar(0, 0, S, a), bar(0, a + G, L, b)] : [bar(0, 0, L, a), bar(0, a + G, S, b)]; },
          // 3 เส้นเรียงเป็นขั้นบันได (ยาวขึ้นหรือสั้นลงทีละขั้น)
          steps: function (W, G, M) { var t = thick(W, Math.floor(R() * 2), (M - 2 * G) / 5), L = W * (NARROW ? rnd(.4, .48) : rnd(.3, .45)), d = W * (NARROW ? rnd(.15, .21) : rnd(.12, .2)), up = R() < .5, p = [];
            for (var i = 0; i < 3; i++) p.push(bar(0, i * (t + G), L + (up ? i : 2 - i) * d, t));

        };
        // ไม่ให้ลายเบิ้ล: ฝั่งเดียวกันห้ามได้แบบเดียวกัน (เสมอ) แล้วเลือกตามลำดับ: เปลี่ยนแบบ + ไม่มีในอีกฝั่งเลย (จอใหญ่ 9 แบบ · 8 กลุ่ม → ทั้งจอไม่ซ้ำ)
        // → ขอบแคบมีกลุ่มมากกว่า: อย่างน้อยไม่ตรงกับอีกฝั่งที่ระดับเดียวกัน (ดูเป็นภาพสะท้อน) → ค่อยยอมให้ช่องนี้ได้แบบเดิม (ลายสุ่มใหม่อยู่ดี)
        var NAMES = Object.keys(KINDS);
        function draw(own, same, other, close) {
          var base = NAMES.filter(function (k) { return same.indexOf(k) < 0; });
          var tries = [
            function (k) { return k !== own && other.indexOf(k) < 0; },
            function (k) { return k !== own && close.indexOf(k) < 0; },
            function (k) { return close.indexOf(k) < 0; },

          g.__k = kind;

            return p.free && p.right * k <= W * .72 && R() < .3 ? p.svg.replace(/^<(\w+)/, '<$1 class="gl" style="--gd:' + rnd(0, 3).toFixed(2) + 's"') : p.svg;

          var kindsOf = function (list, skip) { return list.filter(function (x) { return x !== skip; }).map(function (x) { return x.__k; }); };
          ["fl", "fr"].forEach(function (side) {
            var strip = root.querySelector("." + side), W = strip.offsetWidth, total = strip.offsetHeight, wts = [], sum = 0, top = 0, gs = all[side];
            var n = W < 40 * PX ? Math.max(SLOTS, Math.min(7, Math.round(total / (100 * PX)))) : SLOTS;   // ขอบแคบ (มือถือ) → กลุ่มถี่ขึ้น ขอบดูเต็ม
            for (var i = 0; i < n; i++) { wts.push(rnd(.6, 1.6)); sum += wts[i]; }   // ช่องสูงไม่เท่ากัน (ช่องสูง = ลายใหญ่)

              var near = function () {   // [แบบในฝั่งเดียวกัน, แบบในอีกฝั่ง, แบบในอีกฝั่งที่ระดับใกล้กัน]

              };

    </script>

  <div id="root">
    <div class="boot">
      <div class="boot-ring"></div>
      <div>กำลังโหลด Friends League…</div>

  <script>

  <!-- ═══ PWA: service worker (เฉพาะ https และ localhost · เปิดผ่าน 127.0.0.1 ตอนแก้โค้ดจะไม่ลง เพื่อไม่ให้ติดแคช) ═══ -->
